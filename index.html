<style>

    margin: 0; min-height: 100vh; display: grid; place-items: center;

    font: 16px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  main { max-width: 34em; padding: 3em 1.5em; }
  h1 { font-size: 1.6em; letter-spacing: .02em; margin: 0 0 .2em; color: #f2f2f5; }
  h1 span { color: #6b6b76; font-weight: 400; }
  p.lead { margin: 0 0 2em; color: #9a9aa6; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin: 0 0 1.1em; }
  a { color: #8ab4ff; text-decoration: none; border-bottom: 1px solid #33405c; }
  a:hover { border-bottom-color: #8ab4ff; }
  li small { display: block; color: #84848f; }

<body>
<main>
  <h1>MyCodeHasBugs <span>/ 主页</span></h1>
  <p class="lead">写代码，也写 bug。这里放我做得完的东西。</p>
  <ul>
    <li>
      <a href="https://github.com/MyCodeHasBugs/telegram-promax">telegram-promax</a>
      <small>端对端加密聊天。X25519 + ML-KEM-1024 混合握手，双棘轮，512B 定长分片。仓库名是历史原因，跟 Telegram 没关系。</small>
    </li>
    <li>
      <a href="https://github.com/MyCodeHasBugs/telegram-promax/releases">Releases</a>
      <small>上面那个项目的构建产物，带 SHA256。二进制没签名，用之前自己编一遍更稳。</small>
    </li>
  </ul>
  <p class="foot">这个站没有统计脚本，没有 cookie 横幅——不是克制，是没得放。</p>
</main>
